<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>@@TITLE@@ · Incubics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      background: #eef3f1;
      color: #142033;
      font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    main {
      width: min(440px, 100%);
      padding: 28px 28px 22px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 16px 50px rgba(16, 32, 28, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand img { height: 36px; width: auto; display: block; }
    .brand span {
      padding-left: 12px;
      border-left: 1px solid #d5ddd8;
      color: #5c6b66;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.25; }
    .when { margin: 0 0 16px; color: #3e514b; font-size: 15px; }
    #note { margin: 0 0 18px; color: #1d3b32; font-size: 14px; line-height: 1.45; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
    input {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid #cfd8d4;
      border-radius: 10px;
      font: inherit;
      font-size: 16px;
    }
    input:focus { outline: 2px solid #14a37a; border-color: #14a37a; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button, .app {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    button {
      border: 0;
      background: #0f8f68;
      color: #ffffff;
    }
    .app {
      background: #ffffff;
      color: #0f8f68;
      border: 1px solid #0f8f68;
    }
    button:disabled, .app.is-disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: default;
    }
    footer, .back { margin-top: 18px; color: #6b7c76; font-size: 12px; }
    .back { margin-top: 8px; }
    .back a { color: #0f8f68; }
  </style>
</head>
<body data-open="@@OPEN@@">
  <main>
    <div class="brand">
      <img src="/brand/incubics-logo.png" alt="Incubics">
      <span>Launchpad</span>
    </div>
    <h1>@@TITLE@@</h1>
    <p class="when">@@WHEN@@</p>
    <p id="note">@@NOTE@@</p>
    <form id="join-form">
      <div id="name-row">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" maxlength="40" autocomplete="name" placeholder="Enter your name" @@DISABLED@@>
      </div>
      <div class="actions">
        <button id="browser" type="submit" @@DISABLED@@>Join in browser</button>
        <a id="app" class="app@@APPCLASS@@" href="@@APP@@">Open in Mattermost app</a>
      </div>
    </form>
    <footer>The app opens when it is installed. Otherwise join in the browser.</footer>
    <p class="back"><a href="https://launchpad.incubics.com/incubics">Back to Launchpad</a></p>
  </main>
  <script>
    var open = document.body.getAttribute("data-open") === "yes";
    var note = document.getElementById("note");
    var nameRow = document.getElementById("name-row");
    var signedIn = false;
    fetch("/api/v4/users/me", {
      credentials: "same-origin",
      headers: {"Accept": "application/json", "X-Requested-With": "XMLHttpRequest"}
    }).then(function (response) {
      if (!response.ok) return;
      signedIn = true;
      nameRow.hidden = true;
      if (open) note.textContent = "Join in the browser, or open the Mattermost app if it is installed.";
    }).catch(function () {});

    document.getElementById("join-form").addEventListener("submit", function (event) {
      event.preventDefault();
      if (!open) return;
      var name = document.getElementById("name").value.trim();
      if (!signedIn && !name) {
        note.textContent = "Enter your name to join.";
        return;
      }
      var button = document.getElementById("browser");
      button.disabled = true;
      fetch(location.pathname.replace(/\/$/, "") + "/join", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json",
          "X-Requested-With": "XMLHttpRequest"
        },
        body: JSON.stringify({name: name})
      }).then(function (response) {
        return response.json().then(function (data) {
          return {ok: response.ok, data: data};
        });
      }).then(function (result) {
        if (result.ok && result.data.redirect) {
          try {
            localStorage.setItem("__landingPageSeen__", "true");
            localStorage.setItem("__landing-preference__https://launchpad.incubics.com", "browser");
          } catch (err) {}
          location.href = result.data.redirect;
          return;
        }
        button.disabled = false;
        note.textContent = (result.data && result.data.message) || "The meeting could not be joined.";
      }).catch(function () {
        button.disabled = false;
        note.textContent = "The meeting could not be joined.";
      });
    });
  </script>
</body>
</html>
