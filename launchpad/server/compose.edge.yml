# Added by install.sh only when ports 80 and 443 are free on the host, so this stack's own nginx
# can face the internet directly and manage its own Let's Encrypt certificate.
services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    # pick up renewed certificates
    command: /bin/sh -c "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - launchpad_net

volumes:
  certs:
  acme:
