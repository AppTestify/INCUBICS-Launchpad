name: LaunchPad images

# Builds the two rebranded services (web front end, account service) and publishes them to GHCR.
# The server pulls them with launchpad/server/install.sh.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/confident-planck-6wfn3n']
    paths-ignore:
      - '**.md'
      - 'launchpad/server/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: launchpad-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Rush store
        uses: actions/cache@v4
        with:
          path: common/temp
          key: ${{ runner.os }}-launchpad-${{ hashFiles('common/config/rush/pnpm-lock.yaml') }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$owner" >> "$GITHUB_ENV"
          LAUNCHPAD_REGISTRY="ghcr.io/$owner" LAUNCHPAD_VERSION="${GITHUB_SHA::12}" ./launchpad/build-images.sh

      - name: Push images
        run: |
          for name in front account; do
            docker push --all-tags "$REGISTRY/launchpad-$name"
          done
